<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Risk Platform Dashboard</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      header {
        background: #111827;
        color: white;
        padding: 18px 24px;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 24px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .card {
        background: white;
        border: 1px solid #d9e0ea;
        border-radius: 8px;
        padding: 16px;
      }

      .label {
        color: #5f6b7a;
        font-size: 13px;
      }

      .value {
        font-size: 24px;
        font-weight: 700;
        margin-top: 6px;
      }

      code {
        background: #eef2f7;
        padding: 2px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Transaction Risk Dashboard</h1>
    </header>
    <main id="root"></main>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
      const services = [
        ["Next.js dashboard", "http://localhost:3000"],
        ["auth-service", "http://localhost:8085/health"],
        ["banking-core", "http://localhost:8084/health"],
        ["fraud-decision-api", "http://localhost:8000/health"]
      ];

      function App() {
        return React.createElement(
          React.Fragment,
          null,
          React.createElement("section", { className: "grid" },
            services.map(([name, url]) =>
              React.createElement("article", { className: "card", key: name },
                React.createElement("div", { className: "label" }, name),
                React.createElement("div", { className: "value" }, "Local"),
                React.createElement("p", null, React.createElement("code", null, url))
              )
            )
          ),
          React.createElement("section", { className: "card", style: { marginTop: "16px" } },
            React.createElement("h2", null, "Dashboard"),
            React.createElement("p", null, "The operational UI now lives in the Next.js app under ", React.createElement("code", null, "services/dashboard/app"), "."),
            React.createElement("p", null, "Run ", React.createElement("code", null, "npm run dev"), " from ", React.createElement("code", null, "services/dashboard"), " and open ", React.createElement("code", null, "http://localhost:3000"), ".")
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    </script>
  </body>
</html>
