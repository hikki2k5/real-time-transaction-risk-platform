server:
  port: ${AUTH_SERVICE_PORT:8085}

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/${POSTGRES_DB:transaction_risk}
    username: ${POSTGRES_USER:risk_user}
    password: ${POSTGRES_PASSWORD:risk_password}

app:
  jwt:
    secret: ${BANKING_CORE_JWT_SECRET:local-dev-jwt-secret-change-me-32chars}
    issuer: ${AUTH_JWT_ISSUER:local-auth-service}
    ttl-minutes: ${AUTH_ACCESS_TOKEN_TTL_MINUTES:60}
  cors:
    allowed-origins: ${DASHBOARD_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
