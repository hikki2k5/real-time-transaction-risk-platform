# Local free development infrastructure only.
# Do not add AWS, Snowflake, MinIO, or paid cloud services here.

name: fraud-platform

services:
  kafka:
    image: apache/kafka:4.2.1
    container_name: fraud-platform-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: fraud-platform-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  spark-master:
    image: apache/spark:4.0.3
    container_name: fraud-platform-spark-master
    ports:
      - "7077:7077"
      - "8081:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATA_LAKE_ROOT: /data-lake
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - 0.0.0.0
      - --port
      - "7077"
      - --webui-port
      - "8080"
    volumes:
      - ../pipelines/spark-streaming:/opt/spark/jobs
      - ../data-lake:/data-lake

  spark-worker:
    image: apache/spark:4.0.3
    container_name: fraud-platform-spark-worker
    ports:
      - "8082:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATA_LAKE_ROOT: /data-lake
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 1G
      - --webui-port
      - "8081"
    volumes:
      - ../pipelines/spark-streaming:/opt/spark/jobs
      - ../data-lake:/data-lake
    depends_on:
      - spark-master

  postgres:
    image: postgres:16
    container_name: fraud-platform-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transaction_risk}
      POSTGRES_USER: ${POSTGRES_USER:-risk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risk_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../pipelines/postgres/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: fraud-platform-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: fraud-platform-airflow-webserver
    ports:
      - "8083:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-change-me-local-only}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Local}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-Admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      _PIP_ADDITIONAL_REQUIREMENTS: pyarrow==16.1.0 psycopg2-binary==2.9.9
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-transaction_risk}
      POSTGRES_USER: ${POSTGRES_USER:-risk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risk_password}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_LAKE_ROOT: /data-lake
    volumes:
      - ../pipelines/airflow/dags:/opt/airflow/dags
      - ../pipelines/data-quality:/opt/airflow/data-quality
      - ../pipelines/postgres/ddl:/opt/airflow/postgres/ddl
      - ../pipelines/postgres/transforms:/opt/airflow/postgres/transforms
      - ../data-lake:/data-lake
      - airflow_data:/opt/airflow
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username \"$${AIRFLOW_ADMIN_USERNAME}\"
      --password \"$${AIRFLOW_ADMIN_PASSWORD}\"
      --firstname \"$${AIRFLOW_ADMIN_FIRSTNAME}\"
      --lastname \"$${AIRFLOW_ADMIN_LASTNAME}\"
      --role Admin
      --email \"$${AIRFLOW_ADMIN_EMAIL}\" || true &&
      airflow webserver"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: fraud-platform-airflow-scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      _PIP_ADDITIONAL_REQUIREMENTS: pyarrow==16.1.0 psycopg2-binary==2.9.9
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-transaction_risk}
      POSTGRES_USER: ${POSTGRES_USER:-risk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risk_password}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_LAKE_ROOT: /data-lake
    volumes:
      - ../pipelines/airflow/dags:/opt/airflow/dags
      - ../pipelines/data-quality:/opt/airflow/data-quality
      - ../pipelines/postgres/ddl:/opt/airflow/postgres/ddl
      - ../pipelines/postgres/transforms:/opt/airflow/postgres/transforms
      - ../data-lake:/data-lake
      - airflow_data:/opt/airflow
    command: >
      bash -c "airflow db migrate && airflow scheduler"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    container_name: fraud-platform-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts

volumes:
  kafka_data:
  postgres_data:
  redis_data:
  mlflow_data:
  airflow_data:
